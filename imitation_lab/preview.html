<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexArm 模型联调</title>
<style>body{margin:0;background:#10151e;color:#edf2f9;font:16px system-ui}main{max-width:1180px;margin:auto;padding:28px}h1{font-size:30px;margin:8px 0}p{color:#aebacd;line-height:1.7}.status{display:flex;gap:14px;align-items:center}.pill{background:#174936;color:#a8efcd;padding:7px 12px;border-radius:20px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin:20px 0}.card{background:#1a2230;border:1px solid #303e52;border-radius:14px;padding:18px}img{display:block;width:100%;border-radius:8px;background:#111;aspect-ratio:4/3;object-fit:contain}.small{max-width:280px;margin:auto;image-rendering:auto}h2{font-size:18px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px;border-bottom:1px solid #303e52}th:first-child,td:first-child{text-align:left}.bar{height:6px;background:#344054;border-radius:6px;margin:5px 0;position:relative}.dot{position:absolute;width:8px;height:8px;top:-1px;border-radius:50%}.cyan{background:#55d6dc}.orange{background:#ffbe6a}canvas{width:100%;height:190px}a{color:#55d6dc}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:16px}}</style>
<main><div class="status"><span class="pill">只读影子模式 · 未发送动作</span><span id="status">等待预测…</span></div><h1>NexArm 模型联调</h1><p>展示当前模型使用的相机与真实编码器反馈。ACT 通过 GPU 服务器预测原生位置，再由机器人控制台进行路径检查和有限行程执行；顶部状态显示当前是否正在执行。</p>
<div class="grid"><section class="card"><h2>现场第三人称相机</h2><img id="third"></section><section class="card"><h2>模型输入 · 腕部 RGB</h2><img class="small" id="wrist"><p id="timing"></p><p>青色：当前编码器反馈<br>橙色：模型预测目标<br>单位：原生编码器位置，非角度。</p></section></div>
<section class="card"><h2>当前反馈与模型预测</h2><table><thead><tr><th>关节</th><th>当前反馈</th><th>预测目标</th><th>差值</th><th style="width:28%">0 — 4095</th></tr></thead><tbody id="rows"></tbody></table></section>
<section class="card" style="margin-top:18px"><h2>预测与反馈的平均绝对差（编码器单位）</h2><canvas id="chart" width="1100" height="190"></canvas><p>这条曲线表示模型建议与当前姿态的距离，不是抓取成功率，也不是实际执行后的跟踪误差。</p></section></main>
<script>const names=['J1 底座','J2 肩部','J3 肘部','J4 腕俯仰','J5 腕旋转','夹爪'];let last=-1,hist=[];const $=id=>document.getElementById(id);function render(d){let pred=d.prediction_native;if(!pred)return;$('status').textContent=new Date(d.timestamp*1000).toLocaleTimeString()+' · 帧 '+d.step;$('timing').textContent='模型 '+d.model.toUpperCase()+' · 采集与预测 '+d.latency_ms.toFixed(1)+' ms';$('rows').innerHTML=names.map((n,i)=>{let a=d.state_native[i],b=pred[i];return `<tr><td>${n}</td><td>${a.toFixed(1)}</td><td>${b.toFixed(1)}</td><td>${(b-a).toFixed(1)}</td><td><div class="bar"><i class="dot cyan" style="left:${Math.max(0,Math.min(100,a/4095*100))}%"></i><i class="dot orange" style="left:${Math.max(0,Math.min(100,b/4095*100))}%"></i></div></td></tr>`}).join('');hist.push(pred.reduce((s,p,i)=>s+Math.abs(p-d.state_native[i]),0)/6);if(hist.length>200)hist.shift();let c=$('chart'),x=c.getContext('2d'),max=Math.max(100,...hist);x.clearRect(0,0,c.width,c.height);x.strokeStyle='#ffbe6a';x.lineWidth=2;x.beginPath();hist.forEach((v,i)=>{let px=i/199*c.width,py=180-v/max*160;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#aebacd';x.fillText(max.toFixed(0),4,12);['third','wrist'].forEach(k=>$(k).src=k+'.jpg?t='+d.step)}async function update(){try{let r=await fetch('latest.json?t='+Date.now(),{cache:'no-store'});let d=await r.json();let age=Date.now()/1000-d.timestamp;if(age>3)$('status').textContent='预测已暂停 · 最后一帧 '+new Date(d.timestamp*1000).toLocaleTimeString();if(last!==d.timestamp){last=d.timestamp;render(d)}}catch(e){$('status').textContent='等待实时推理启动…'}setTimeout(update,250)}update();</script><script>async function showExecution(){try{let r=await fetch('execution.json?t='+Date.now(),{cache:'no-store'});if(r.ok){let d=await r.json();let pill=document.querySelector('.pill');pill.textContent=d.message;pill.style.background=d.mode==='executing_trial'?'#7c371e':'#174936';}}catch(e){}setTimeout(showExecution,250)}showExecution();</script></html>
